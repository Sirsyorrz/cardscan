[package]
name = "cardscan"
version = "0.1.6"
edition = "2021"
default-run = "cardscan-app"

[lib]
name = "cardscan"
path = "src/lib.rs"

[[bin]]
name = "cardscan-app"
path = "src/bin/app.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri serves devUrl unless this is on, in which case it serves the embedded
# frontendDist. The Tauri CLI passes it for builds; plain `cargo build` will not.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
