name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Linting the app binary pulls in Tauri, so the GTK/WebKit headers are
      # needed even though nothing is bundled here.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Formatting
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test --lib --tests

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # The matcher tests need data/cards.db, which only the bundle job builds.
      - name: Typecheck matcher
        run: |
          npm ci
          npm run typecheck

      - name: Typecheck app
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compile scripts
        run: python -m compileall -q -l . tools app

  # Seed card database for the installers. The source downloads are cached so
  # repeat runs only refetch what build_db.py considers stale.
  cards:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/cache@v6
        with:
          path: tools/cache
          key: build-db-${{ github.run_id }}
          restore-keys: build-db-
      - run: python tools/build_db.py
      - uses: actions/upload-artifact@v7
        with:
          name: cards-db
          path: data/cards.db
          retention-days: 1

  # Packaging needs the signing key, because declaring an updater pubkey makes
  # every bundle a signed one. Fork pull requests cannot see secrets, so they
  # only run the tests.
  bundle:
    needs: [test, cards]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage
          - os: windows-latest
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/download-artifact@v8
        with:
          name: cards-db
          path: data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Stage bundle
        run: python app/stage_bundle.py ${{ matrix.platform }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci

      - name: Bundle
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: cardscan-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
