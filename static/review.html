<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cardscan</title>
<style>
  :root { --bg:#111214; --panel:#1a1c20; --panel2:#22252b; --line:#2e323a; --text:#e6e7ea; --muted:#9aa0aa;
          --added:#3ecf6e; --review:#f0a531; --repeat:#6b7280; --rejected:#d9534f; --accent:#5aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button, select, input { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); }
  button.primary { background:var(--added); color:#000; border-color:var(--added); }
  button.danger:hover { border-color:var(--rejected); color:var(--rejected); }
  .grow { flex:1; }
  .muted { color:var(--muted); }
  main { display:flex; height:calc(100vh - 53px); }
  #list { flex:1; overflow:auto; padding:12px; }
  #side { width:520px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px; display:none; }
  #side.open { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .tile { background:var(--panel); border:2px solid transparent; border-radius:8px; overflow:hidden; cursor:pointer; position:relative; }
  .tile.sel { border-color:var(--accent); }
  .tile img.cap { width:100%; aspect-ratio:63/88; object-fit:cover; display:block; }
  .tile .meta { padding:6px 8px; font-size:12px; }
  .tile .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.repeat, .tile.rejected { opacity:.45; }
  .badge { position:absolute; top:6px; left:6px; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; color:#000; text-transform:uppercase; }
  .b-added { background:var(--added); } .b-review { background:var(--review); } .b-repeat { background:var(--repeat); color:#fff; } .b-rejected { background:var(--rejected); color:#fff; }
  .pair { display:flex; gap:10px; }
  .pair img { width:50%; border-radius:8px; aspect-ratio:63/88; object-fit:cover; background:var(--panel2); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  h2 { font-size:15px; margin:14px 0 6px; }
  .opts { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .opt { cursor:pointer; border:2px solid transparent; border-radius:6px; background:var(--panel2); padding:3px; font-size:11px; text-align:center; }
  .opt.cur { border-color:var(--added); }
  .opt:hover { border-color:var(--accent); }
  .opt img { width:100%; aspect-ratio:63/88; object-fit:cover; border-radius:4px; display:block; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-weight:500; }
  td img { width:40px; border-radius:3px; display:block; }
  td.num, th.num { text-align:right; }
  .qty button { padding:2px 8px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:8px 14px; border-radius:6px; display:none; }
  kbd { background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>cardscan</h1>
  <button id="tab-review" class="on">Review</button>
  <button id="tab-items">Collection</button>
  <span class="grow"></span>
  <span id="review-bar" class="row" style="margin:0">
    <select id="session"></select>
    <button data-filter="review" class="on">Needs review</button>
    <button data-filter="added">Added</button>
    <button data-filter="all">All</button>
  </span>
  <span id="items-bar" class="row" style="margin:0; display:none">
    <input id="items-q" placeholder="Filter by name">
    <select id="items-sort"><option value="recent">Recent</option><option value="name">Name</option><option value="set">Set</option><option value="value">Value</option></select>
    <span id="items-total" class="muted"></span>
    <button id="refresh-prices">Refresh prices</button>
  </span>
</header>
<main>
  <div id="list"></div>
  <div id="side"></div>
</main>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const state = { tab: 'review', filter: 'review', session: 0, scans: [], selected: null };

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = 'none'), 2500);
}
const cardLine = (c) => c ? `${esc(c.set_code)} #${esc(c.number)}${c.lang === 'ja' ? ' JP' : ''}` : '';
const gameOf = (c) => !c ? '' : c.game === 'mtg' ? 'mtg' : c.lang === 'ja' ? 'pkj' : 'pkm';

async function loadSessions() {
  const list = await api('/api/sessions');
  const sel = $('#session');
  const keep = sel.value;
  sel.innerHTML = list.map((s) => `<option value="${s.id}">#${s.id} ${new Date(s.started_at).toLocaleString()} · ${s.added ?? 0} added · ${s.review ?? 0} review</option>`).join('');
  if (keep && list.some((s) => String(s.id) === keep)) sel.value = keep;
  state.session = Number(sel.value) || 0;
}

function visible() {
  return state.scans.filter((s) => state.filter === 'all' || s.status === state.filter);
}

async function loadScans() {
  if (!state.session) { $('#list').innerHTML = '<p class="muted">No sessions yet. Run scan.py.</p>'; return; }
  const data = await api(`/api/scans?session=${state.session}`);
  state.scans = data.scans;
  renderScans();
}

function renderScans() {
  const shown = visible();
  $('#list').innerHTML = shown.length ? `<div class="grid">${shown.map((s) => `
    <div class="tile ${s.status} ${state.selected === s.id ? 'sel' : ''}" data-id="${s.id}">
      <span class="badge b-${s.status}">${s.status}</span>
      <img class="cap" loading="lazy" src="/capture/${s.id}">
      <div class="meta"><div class="name">${s.card ? esc(s.card.name) : '?'}</div>
      <div class="muted">${s.n} · ${cardLine(s.card)} ${s.finish_label && s.finish_label !== 'Normal' ? '· ' + esc(s.finish_label) : ''}</div></div>
    </div>`).join('')}</div>` : '<p class="muted">Nothing here.</p>';
}

async function openScan(id) {
  state.selected = id;
  renderScans();
  const s = state.scans.find((x) => x.id === id);
  if (!s) return;
  const side = $('#side');
  side.classList.add('open');
  const fin = s.card_id ? await api(`/api/finishes?card=${encodeURIComponent(s.card_id)}`) : [];
  side.innerHTML = `
    <div class="pair"><img src="/capture/${s.id}"><img src="${s.card ? esc(s.card.img_large) : ''}" alt=""></div>
    <h2>${s.card ? esc(s.card.name) : 'Not identified'} <span class="muted">${s.card ? esc(s.card.set_name) + ' · ' + cardLine(s.card) : ''}</span></h2>
    <div class="muted">Capture ${s.n} at ${s.t}s · ${esc(s.status)}${s.confidence ? ' · ' + esc(s.confidence) : ''}${s.rough ? ' · rough outline' : ''}</div>
    <div class="row">
      ${fin.length ? `<select id="finish">${fin.map((f) => `<option value="${esc(f.key)}" ${f.key === s.finish ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select>` : ''}
      <select id="condition">${['NM', 'LP', 'MP', 'HP', 'DMG'].map((c) => `<option ${c === s.condition ? 'selected' : ''}>${c}</option>`).join('')}</select>
    </div>
    <div class="row">
      <button class="primary" id="confirm" ${s.card_id ? '' : 'disabled'}>${s.status === 'added' ? 'Added' : 'Add'} <kbd>Enter</kbd></button>
      <button id="extra" ${s.card_id ? '' : 'disabled'}>+1 copy</button>
      <button class="danger" id="reject">${s.status === 'rejected' ? 'Rejected' : 'Not a card'} <kbd>X</kbd></button>
      ${s.status === 'added' ? '<button id="unadd">Remove</button>' : ''}
    </div>
    <h2>Other printings</h2><div id="opts" class="opts"><span class="muted">Loading</span></div>
    <h2>Search</h2>
    <div class="row"><input id="q" class="grow" placeholder="Card name">
      <select id="game"><option value="">Any game</option><option value="mtg" ${gameOf(s.card) === 'mtg' ? 'selected' : ''}>Magic</option><option value="pkm" ${gameOf(s.card) === 'pkm' ? 'selected' : ''}>Pokémon</option><option value="pkj" ${gameOf(s.card) === 'pkj' ? 'selected' : ''}>Pokémon JP</option></select></div>
    <div id="results" class="opts"></div>
    <p class="muted"><kbd>J</kbd>/<kbd>K</kbd> next/previous, <kbd>/</kbd> search</p>`;
  const update = async (body, msg) => {
    try { await api(`/api/scans/${s.id}`, body); toast(msg); await loadScans(); await loadSessions(); openScan(s.id); }
    catch (e) { toast(e.message); }
  };
  $('#confirm').onclick = () => update({ status: 'added', finish: $('#finish')?.value, condition: $('#condition').value }, 'Added');
  $('#reject').onclick = () => update({ status: 'rejected' }, 'Rejected');
  if ($('#unadd')) $('#unadd').onclick = () => update({ status: 'review' }, 'Removed from the collection');
  $('#extra').onclick = async () => {
    await api('/api/items', { card_id: s.card_id, finish: $('#finish')?.value || s.finish, condition: $('#condition').value, delta: 1 });
    toast('Added another copy');
  };
  const onFinish = () => s.status === 'added' && update({ finish: $('#finish').value, condition: $('#condition').value }, 'Updated');
  if ($('#finish')) $('#finish').onchange = onFinish;
  $('#condition').onchange = onFinish;
  const choose = (id) => update({ card_id: id, status: 'added' }, 'Changed and added');
  const tiles = (cards) => cards.map((c) => `<div class="opt ${c.id === s.card_id ? 'cur' : ''}" data-card="${esc(c.id)}">
      <img loading="lazy" onerror="this.style.visibility='hidden'" src="${esc(c.img || '')}" alt=""><div>${cardLine(c)}</div><div class="muted">${esc(c.name.length > 22 ? c.name.slice(0, 21) + '…' : c.name)}</div></div>`).join('');
  const bind = (el) => el.querySelectorAll('.opt').forEach((o) => (o.onclick = () => choose(o.dataset.card)));
  const opts = await api(`/api/options?scan=${s.id}`);
  $('#opts').innerHTML = opts.length ? tiles(opts) : '<span class="muted">None</span>';
  bind($('#opts'));
  let timer;
  const runSearch = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const res = await api(`/api/search?q=${encodeURIComponent($('#q').value)}&game=${$('#game').value}`);
      $('#results').innerHTML = tiles(res);
      bind($('#results'));
    }, 250);
  };
  $('#q').oninput = runSearch;
  $('#game').onchange = runSearch;
}

function step(dir) {
  const shown = visible();
  if (!shown.length) return;
  const i = shown.findIndex((s) => s.id === state.selected);
  const next = shown[Math.min(shown.length - 1, Math.max(0, i + dir))] ?? shown[0];
  openScan(next.id);
  document.querySelector(`.tile[data-id="${next.id}"]`)?.scrollIntoView({ block: 'nearest' });
}

function money(usd, rate) {
  if (usd == null) return '';
  return rate ? `A$${(usd * rate).toFixed(2)}` : `US$${usd.toFixed(2)}`;
}

async function loadItems() {
  const data = await api(`/api/items?q=${encodeURIComponent($('#items-q').value)}&sort=${$('#items-sort').value}`);
  const rows = data.items, rate = data.aud_per_usd;
  const copies = rows.reduce((n, r) => n + r.qty, 0);
  const value = rows.reduce((n, r) => n + (r.usd || 0) * r.qty, 0);
  const when = data.prices_at ? `prices ${new Date(Number(data.prices_at)).toLocaleDateString()}` : 'snapshot prices';
  $('#items-total').textContent = `${copies} cards · ${rows.length} entries · ${money(value, rate)} · ${when}`;
  $('#list').innerHTML = `<table><thead><tr><th></th><th>Card</th><th>Set</th><th>Finish</th><th>Cond.</th><th class="num">Price</th><th class="num">Qty</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr data-i="${i}"><td><img loading="lazy" onerror="this.style.visibility='hidden'" src="${esc(r.img || '')}"></td>
      <td>${esc(r.name)}${r.local_name ? ` <span class="muted">${esc(r.local_name)}</span>` : ''}</td>
      <td>${esc(r.set_name)} <span class="muted">${cardLine(r)}</span></td><td>${esc(r.finish_label)}</td><td>${esc(r.condition)}</td>
      <td class="num">${money(r.usd, rate)}</td>
      <td class="num qty"><button data-d="-1">−</button> ${r.qty} <button data-d="1">+</button></td></tr>`).join('')}
    </tbody></table>`;
  $('#list').querySelectorAll('button[data-d]').forEach((b) => (b.onclick = async () => {
    const r = rows[b.closest('tr').dataset.i];
    await api('/api/items', { card_id: r.card_id, finish: r.finish, condition: r.condition, delta: Number(b.dataset.d) });
    loadItems();
  }));
}

function setTab(tab) {
  state.tab = tab;
  $('#tab-review').classList.toggle('on', tab === 'review');
  $('#tab-items').classList.toggle('on', tab === 'items');
  $('#review-bar').style.display = tab === 'review' ? '' : 'none';
  $('#items-bar').style.display = tab === 'items' ? '' : 'none';
  $('#side').classList.toggle('open', tab === 'review' && state.selected != null);
  tab === 'review' ? loadScans() : loadItems();
}

$('#tab-review').onclick = () => setTab('review');
$('#tab-items').onclick = () => setTab('items');
document.querySelectorAll('[data-filter]').forEach((b) => (b.onclick = () => {
  state.filter = b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('on', x === b));
  renderScans();
}));
$('#session').onchange = () => { state.session = Number($('#session').value); state.selected = null; $('#side').classList.remove('open'); loadScans(); };
$('#list').onclick = (e) => { const t = e.target.closest('.tile'); if (t) openScan(Number(t.dataset.id)); };
$('#items-q').oninput = () => { clearTimeout(loadItems.t); loadItems.t = setTimeout(loadItems, 250); };
$('#items-sort').onchange = loadItems;
$('#refresh-prices').onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = 'Refreshing';
  try { const r = await api('/api/prices', {}); toast(r.log.join(' · ')); } catch (err) { toast(err.message); }
  e.target.disabled = false; e.target.textContent = 'Refresh prices';
  loadItems();
};
document.addEventListener('keydown', (e) => {
  if (state.tab !== 'review' || ['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'j') step(1);
  else if (e.key === 'k') step(-1);
  else if (e.key === 'Enter') $('#confirm')?.click();
  else if (e.key === 'x') $('#reject')?.click();
  else if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); }
});

(async () => {
  await loadSessions();
  await loadScans();
  // follow a running scan: new captures show up without reloading
  setInterval(async () => {
    if (state.tab !== 'review' || document.hidden) return;
    const before = state.scans.length;
    await loadSessions();
    const data = await api(`/api/scans?session=${state.session}`);
    if (data.scans.length !== before || JSON.stringify(data.scans.map((s) => s.status + s.card_id)) !== JSON.stringify(state.scans.map((s) => s.status + s.card_id))) {
      state.scans = data.scans;
      renderScans();
    }
  }, 3000);
})();
</script>
</body>
</html>
